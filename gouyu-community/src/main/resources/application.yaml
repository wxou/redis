server:
  port: 8081
spring:
  application:
    name: gouyu-community
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: ${GOUYU_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/gouyu?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${GOUYU_MYSQL_USERNAME:root}
    password: ${GOUYU_MYSQL_PASSWORD:}
  redis:
    host: ${GOUYU_REDIS_HOST:127.0.0.1}
    port: ${GOUYU_REDIS_PORT:6379}
    password: ${GOUYU_REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
mybatis-plus:
  type-aliases-package: com.gouyu.entity # 别名扫描包
logging:
  level:
    com.gouyu: debug
gouyu:
  auth:
    # 未接入短信服务时，本地开发模式把验证码返回给前端；生产环境应设为 false。
    expose-code: ${GOUYU_EXPOSE_LOGIN_CODE:true}
