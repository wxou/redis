server:
  port: 8081
spring:
  application:
    name: gouyu-community
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: ${GOUYU_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/gouyu?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${GOUYU_MYSQL_USERNAME:root}
    password: ${GOUYU_MYSQL_PASSWORD:}
  redis:
    host: ${GOUYU_REDIS_HOST:127.0.0.1}
    port: ${GOUYU_REDIS_PORT:6379}
    password: ${GOUYU_REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
mybatis-plus:
  type-aliases-package: com.gouyu.entity # 别名扫描包
logging:
  level:
    com.gouyu: debug
gouyu:
  auth:
    # 未接入短信服务时，本地开发模式把验证码返回给前端；生产环境应设为 false。
    expose-code: ${GOUYU_EXPOSE_LOGIN_CODE:true}
    code-ttl-minutes: ${GOUYU_AUTH_CODE_TTL_MINUTES:2}
    session-idle-minutes: ${GOUYU_AUTH_SESSION_IDLE_MINUTES:120}
    session-absolute-hours: ${GOUYU_AUTH_SESSION_ABSOLUTE_HOURS:168}
    password-min-length: ${GOUYU_AUTH_PASSWORD_MIN_LENGTH:8}
    password-max-length: ${GOUYU_AUTH_PASSWORD_MAX_LENGTH:20}
    bcrypt-strength: ${GOUYU_AUTH_BCRYPT_STRENGTH:10}
    code-send-interval-seconds: ${GOUYU_AUTH_CODE_SEND_INTERVAL_SECONDS:60}
    code-phone-daily-limit: ${GOUYU_AUTH_CODE_PHONE_DAILY_LIMIT:10}
    code-ip-hourly-limit: ${GOUYU_AUTH_CODE_IP_HOURLY_LIMIT:30}
    code-max-failures: ${GOUYU_AUTH_CODE_MAX_FAILURES:5}
    login-ip-limit: ${GOUYU_AUTH_LOGIN_IP_LIMIT:30}
    login-ip-window-minutes: ${GOUYU_AUTH_LOGIN_IP_WINDOW_MINUTES:10}
    login-account-max-failures: ${GOUYU_AUTH_LOGIN_ACCOUNT_MAX_FAILURES:5}
    login-account-failure-window-minutes: ${GOUYU_AUTH_LOGIN_ACCOUNT_FAILURE_WINDOW_MINUTES:15}
    login-lock-minutes: ${GOUYU_AUTH_LOGIN_LOCK_MINUTES:15}
    audit-retention-days: ${GOUYU_AUTH_AUDIT_RETENTION_DAYS:180}
